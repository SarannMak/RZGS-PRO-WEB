name = "rzgs-guardian"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Health/security sweep every 15 minutes. It only messages you when something changes.
[triggers]
crons = ["*/15 * * * *"]

# Create with:  npx wrangler kv namespace create STATE   then paste the id below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

[vars]
SITE_HOSTS = "rzgspro.com,www.rzgspro.com"
GITHUB_REPO = "sarannmak/rzgs-pro-web"
SUPABASE_PROJECT_REF = "zaziizzsbytkdlatoutv"
CLAUDE_MODEL = "claude-sonnet-5-5"
FAILED_LOGIN_ALERT_THRESHOLD = "25"

# Secrets (never put these here), set each with `npx wrangler secret put NAME`:
#   TELEGRAM_BOT_TOKEN      from @BotFather
#   TELEGRAM_WEBHOOK_SECRET random string, 32+ chars (A-Z a-z 0-9 _ -)
#   OWNER_TELEGRAM_ID       your numeric Telegram user id (ask @userinfobot)
#   ANTHROPIC_API_KEY       Claude API key
#   GITHUB_TOKEN            fine-grained PAT, this repo only, READ-ONLY (+ Issues: write if you want issue creation)
#   SUPABASE_ACCESS_TOKEN   Management API token (Account > Access Tokens)
