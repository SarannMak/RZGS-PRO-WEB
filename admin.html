<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — RZGS-PRO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030c13">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="assets/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=36">
  <link rel="stylesheet" href="auth.css?v=19">
  <style>
    .adm { padding-top: 32px; padding-bottom: 64px; }
    .adm h1 { margin: 0 0 6px; font: 800 30px/1.1 var(--font-display); }
    .adm-card { margin-top: 12px; padding: 14px; border: 1px solid var(--border-strong); background: var(--bg); }
    .adm-card h3 { margin: 0 0 8px; font: 700 18px/1.2 var(--font-display); }
    .adm-card dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0 0 10px; font-size: 14px; }
    .adm-card dt { color: var(--text-subtle); font: 500 12px/1.6 var(--font-mono); }
    .adm-card dd { margin: 0; overflow-wrap: anywhere; }
    .adm-why { margin: 0 0 12px; padding: 10px 12px; border-left: 2px solid var(--warn); background: rgba(255, 210, 63, 0.08); color: var(--text-muted); font-size: 14px; }
    .adm-note { width: 100%; min-height: 44px; margin-bottom: 10px; padding: 8px 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 400 14px/1.4 var(--font-body); }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .adm-table th, .adm-table td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    .adm-table th { color: var(--text-subtle); font: 500 11px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }
    .adm-scroll { overflow-x: auto; }
    .adm-empty { margin: 8px 0 0; color: var(--text-subtle); font-size: 14px; }
    .adm-top { display: flex; margin: 14px 0 20px; }
    .adm-give { margin-top: 12px; }
    .adm-give .btn { width: 100%; }
    .adm-why[hidden] { display: none; }
    .adm-why code { font: 600 14px/1.6 var(--font-mono); user-select: all; }
    .adm .dash-panel + .dash-panel { margin-top: 16px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0" defer></script>
  <script src="admin.js?v=1" defer></script>
</head>
<body>
  <main class="container adm" id="main">
    <h1>Orders</h1>
    <p class="dash-hint" data-adm-status>Loading...</p>
    <div class="adm-top"><a class="btn btn-ghost btn-sm" href="dashboard">My dashboard</a></div>

    <section class="dash-panel" data-adm-area hidden>
      <h2>Waiting for you</h2>
      <div data-adm-waiting></div>
    </section>

    <section class="dash-panel" data-adm-area hidden>
      <h2>Give a Diamond plan</h2>
      <p class="dash-hint">Diamond is sold on Telegram. When the client has paid you, type their website email and their MT5 number. Their bot, passwords and file appear on their dashboard, for 30 days from now.</p>
      <form class="adm-give" data-adm-give novalidate>
        <input class="adm-note" name="email" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="The client's website email" aria-label="The client's website email">
        <input class="adm-note" name="account" type="text" inputmode="numeric" autocomplete="off" placeholder="Their MT5 number" aria-label="Their MT5 number">
        <p class="adm-why" data-adm-give-msg role="status" hidden></p>
        <button class="btn btn-primary btn-sm" type="submit" data-adm-give-go>Give Diamond</button>
      </form>
    </section>

    <section class="dash-panel" data-adm-area hidden>
      <h2>Latest</h2>
      <div class="adm-scroll"><table class="adm-table">
        <thead><tr><th>When</th><th>Client</th><th>Plan</th><th>Broker</th><th>MT5</th><th>Paid</th><th>Stage</th></tr></thead>
        <tbody data-adm-recent></tbody>
      </table></div>
    </section>
  </main>
</body>
</html>
